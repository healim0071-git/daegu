<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_bg_10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="grad_motif_10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1F2937" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="grid_10" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" fill="url(#grad_bg_10)" />
  <rect width="500" height="300" fill="url(#grid_10)" />

  <!-- Ambient light glow -->
  <circle cx="360" cy="150" r="130" fill="#F43F5E" opacity="0.12" filter="blur(30px)" />
  <circle cx="80" cy="60" r="90" fill="#F43F5E" opacity="0.08" filter="blur(20px)" />

  <!-- Left Content Block -->
  <g transform="translate(36, 48)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="rgba(244,63,94,0.18)" stroke="#F43F5E" stroke-width="1.2" />
    <circle cx="12" cy="13" r="3.5" fill="#F43F5E" />
    <text x="24" y="17" fill="#FECDD3" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="700" letter-spacing="-0.2px">수면 구조 붕괴</text>

    <!-- Title -->
    <text x="0" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5px">
      수면 단편화와 주간 피로
    </text>

    <!-- Subtitle (word wrapped) -->
    <text x="0" y="98" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500" line-height="1.5">
      얕은 잠(REM)의 반복과 서파수면 결핍에 
    </text>
    <text x="0" y="118" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500">
      따른 뇌 피로 누적
    </text>

    <!-- Clinical Spec Pill -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="10" y="15" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600">
        HEALIM CLINICAL LAB
      </text>
    </g>
  </g>

  <!-- Right Motif Illustration -->
  
        <g transform="translate(340, 150)">
          <!-- Hypnogram stepped wave fragmentation -->
          <path d="M-50,-30 L-25,-30 L-25,0 L0,0 L0,30 L25,30 L25,-10 L50,-10" fill="none" stroke="#F43F5E" stroke-width="3.5" stroke-linejoin="round"/>
          <!-- alert break points -->
          <circle cx="-25" cy="-30" r="5" fill="#FFF"/>
          <circle cx="0" cy="0" r="5" fill="#FFF"/>
          <circle cx="25" cy="30" r="5" fill="#FFF"/>
          <circle cx="25" cy="-10" r="6" fill="#EF4444"/>
          <!-- Stage labels -->
          <text x="-40" y="-36" fill="#FFF" font-size="9">REM</text>
          <text x="35" y="44" fill="#F43F5E" font-size="9">서파</text>
        </g>
        
</svg>