<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" width="100%" height="100%">
  <defs>
    <filter id="sheetShadow2" x="-3%" y="-2%" width="106%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="headerBarGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c4349"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="heatRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Frame matching brainwave_chart & hrv_autonomic_test -->
  <rect width="720" height="780" rx="22" fill="#efefef" stroke="#d4d4d8" stroke-width="2"/>

  <!-- Inner Clinical Report Sheet -->
  <rect x="34" y="28" width="652" height="724" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#sheetShadow2)"/>

  <!-- Report Top Banner -->
  <path d="M35 36 Q35 29 42 29 L678 29 Q685 29 685 36 L685 96 L35 96 Z" fill="url(#headerBarGrad2)"/>
  <ellipse cx="145" cy="62" rx="92" ry="30" fill="#061c21" stroke="#34d399" stroke-width="1.2"/>
  <text x="145" y="55" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">四診合參 System</text>
  <text x="145" y="74" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="15.5" font-weight="900" fill="#34d399">복진·맥진·체질</text>

  <text x="435" y="68" text-anchor="middle" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="22.5" font-weight="900" fill="#ffffff" letter-spacing="0.8">한의학적 복진·맥진·장부 허실 진단표</text>
  <circle cx="330" cy="42" r="2.5" fill="#99f6e4"/>
  <circle cx="365" cy="42" r="2.5" fill="#99f6e4"/>
  <circle cx="400" cy="42" r="2.5" fill="#99f6e4"/>
  <circle cx="435" cy="42" r="2.5" fill="#99f6e4"/>

  <!-- Patient Metadata Row -->
  <rect x="52" y="106" width="616" height="44" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="68" y="124" font-family="'Pretendard', sans-serif" font-size="11.5" font-weight="700" fill="#334155">진 단 코 드 : KM-2026-119</text>
  <text x="68" y="141" font-family="'Pretendard', sans-serif" font-size="11.5" font-weight="700" fill="#334155">진 단 항 목 : 흉복부 4대 압통 구획 · 3부9후 맥파 · 오장육부 허실</text>
  <text x="405" y="124" font-family="'Pretendard', sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c">변 증 유 형 : 간기울결(肝氣鬱結) 겸 심담허겁</text>
  <text x="405" y="141" font-family="'Pretendard', sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">전 담 진 단 : 한방신경정신과 박사 김대억 대표원장</text>

  <!-- Left Column: 복진(腹診) 4대 핵심 신경정신과 구획도 -->
  <rect x="52" y="162" width="292" height="22" rx="3" fill="#0f172a"/>
  <text x="198" y="177" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#ffffff">1. 복진(腹診) 흉복부 긴장·압통 구획도</text>
  <rect x="52" y="188" width="292" height="310" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>

  <!-- Anatomical Torso Outline inside Left Column -->
  <g transform="translate(152, 204)">
    <path d="M-55,18 Q-70,22 -72,48 L-66,145 Q-62,210 -58,265 L58,265 Q62,210 66,145 L72,48 Q70,22 55,18 Q28,12 0,12 Q-28,12 -55,18 Z" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <path d="M0,45 L0,105 M0,105 Q-35,112 -54,148 M0,105 Q35,112 54,148" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,2"/>
    <line x1="-22" y1="115" x2="-20" y2="258" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="22" y1="115" x2="20" y2="258" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="0" y1="105" x2="0" y2="258" stroke="#cbd5e1" stroke-width="1"/>

    <circle cx="0" cy="68" r="24" fill="url(#heatRed)"/>
    <circle cx="0" cy="68" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>

    <ellipse cx="-32" cy="126" rx="22" ry="15" transform="rotate(-22 -32 126)" fill="url(#heatAmber)"/>
    <ellipse cx="32" cy="126" rx="22" ry="15" transform="rotate(22 32 126)" fill="url(#heatAmber)"/>
    <circle cx="-30" cy="126" r="5" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="30" cy="126" r="5" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>

    <circle cx="0" cy="148" r="22" fill="url(#heatRed)"/>
    <circle cx="0" cy="148" r="5.5" fill="#e11d48" stroke="#ffffff" stroke-width="1.5"/>

    <circle cx="0" cy="195" r="3" fill="#475569"/>
    <circle cx="0" cy="226" r="25" fill="url(#heatBlue)"/>
    <circle cx="0" cy="226" r="5.5" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>

    <line x1="6" y1="68" x2="72" y2="52" stroke="#dc2626" stroke-width="1.3"/>
    <text x="76" y="48" font-family="'Pretendard', sans-serif" font-size="10.5" font-weight="900" fill="#dc2626">① 전중혈 압통</text>
    <text x="76" y="61" font-family="'Pretendard', sans-serif" font-size="9.5" font-weight="600" fill="#475569">심포울체·흉민·화병</text>

    <line x1="35" y1="126" x2="72" y2="110" stroke="#d97706" stroke-width="1.3"/>
    <text x="76" y="106" font-family="'Pretendard', sans-serif" font-size="10.5" font-weight="900" fill="#b45309">② 흉협고만</text>
    <text x="76" y="119" font-family="'Pretendard', sans-serif" font-size="9.5" font-weight="600" fill="#475569">간기울결·교감항진</text>

    <line x1="6" y1="148" x2="72" y2="164" stroke="#e11d48" stroke-width="1.3"/>
    <text x="76" y="162" font-family="'Pretendard', sans-serif" font-size="10.5" font-weight="900" fill="#be123c">③ 심하비경</text>
    <text x="76" y="175" font-family="'Pretendard', sans-serif" font-size="9.5" font-weight="600" fill="#475569">심담허겁·담음정체</text>

    <line x1="6" y1="226" x2="72" y2="222" stroke="#0284c7" stroke-width="1.3"/>
    <text x="76" y="219" font-family="'Pretendard', sans-serif" font-size="10.5" font-weight="900" fill="#0369a1">④ 제하박동·복직근구급</text>
    <text x="76" y="232" font-family="'Pretendard', sans-serif" font-size="9.5" font-weight="600" fill="#475569">자율신경과민·상열하한</text>
  </g>

  <!-- Right Column Top: 맥진(脈診) 촌관척 맥파 분석 -->
  <rect x="358" y="162" width="310" height="22" rx="3" fill="#0f172a"/>
  <text x="513" y="177" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#ffffff">2. 맥진(脈診) 촌·관·척 맥파 및 긴장도</text>
  <rect x="358" y="188" width="310" height="145" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>

  <rect x="372" y="200" width="282" height="78" rx="4" fill="#0f172a"/>
  <line x1="372" y1="226" x2="654" y2="226" stroke="#1e293b" stroke-width="1"/>
  <line x1="372" y1="252" x2="654" y2="252" stroke="#1e293b" stroke-width="1"/>
  <path d="M378,258 L392,258 L400,210 L408,264 L415,242 L422,258 L442,258 L450,208 L458,264 L465,240 L472,258 L492,258 L500,212 L508,264 L515,243 L522,258 L542,258 L550,206 L558,264 L565,241 L572,258 L592,258 L600,210 L608,264 L615,242 L622,258 L646,258" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round"/>
  <text x="382" y="215" font-family="'Pretendard', sans-serif" font-size="10" font-weight="700" fill="#fde047">맥상: 현세삭맥 (弦細數脈 · 긴장도 상승)</text>

  <text x="374" y="297" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#0f172a">• 좌관(左關·간담): <tspan fill="#dc2626">현긴(弦緊) - 스트레스 울체</tspan></text>
  <text x="374" y="317" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#0f172a">• 좌촌(左寸·심장): <tspan fill="#d97706">세삭(細數) - 심열·신경과민</tspan></text>

  <!-- Right Column Bottom: 오장육부(五臟六腑) 허실 밸런스 -->
  <rect x="358" y="345" width="310" height="22" rx="3" fill="#0f172a"/>
  <text x="513" y="360" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#ffffff">3. 오장육부 기능적 허실(虛實) 분포</text>
  <rect x="358" y="371" width="310" height="127" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>

  <g transform="translate(374, 386)">
    <line x1="145" y1="0" x2="145" y2="100" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="95" y="10" font-family="'Pretendard', sans-serif" font-size="9.5" font-weight="700" fill="#0284c7">◀ 기능 허약(虛)</text>
    <text x="160" y="10" font-family="'Pretendard', sans-serif" font-size="9.5" font-weight="700" fill="#dc2626">울체·과열(實) ▶</text>

    <text x="0" y="28" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#0f172a">간·담 (肝膽)</text>
    <rect x="145" y="18" width="95" height="11" rx="3" fill="#ef4444"/>
    <text x="245" y="28" font-family="'Pretendard', sans-serif" font-size="10" font-weight="800" fill="#dc2626">기울(氣鬱)</text>

    <text x="0" y="48" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#0f172a">심·소장 (心)</text>
    <rect x="145" y="38" width="76" height="11" rx="3" fill="#f59e0b"/>
    <text x="226" y="48" font-family="'Pretendard', sans-serif" font-size="10" font-weight="800" fill="#d97706">심열(心熱)</text>

    <text x="0" y="68" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#0f172a">비·위 (脾胃)</text>
    <rect x="82" y="58" width="63" height="11" rx="3" fill="#0ea5e9"/>
    <text x="42" y="68" font-family="'Pretendard', sans-serif" font-size="10" font-weight="800" fill="#0284c7">기허(氣虛)</text>

    <text x="0" y="88" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800" fill="#0f172a">신·방광 (腎)</text>
    <rect x="92" y="78" width="53" height="11" rx="3" fill="#3b82f6"/>
    <text x="52" y="88" font-family="'Pretendard', sans-serif" font-size="10" font-weight="800" fill="#2563eb">음허(陰虛)</text>
  </g>

  <!-- Section 4: 사진합참 맞춤 변증 지표 -->
  <rect x="52" y="512" width="240" height="22" rx="3" fill="#0f172a"/>
  <text x="172" y="527" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" fill="#ffffff">4. 사진합참(四診合參) 맞춤 변증 지표</text>
  <rect x="52" y="538" width="616" height="108" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>

  <rect x="66" y="550" width="188" height="84" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
  <text x="160" y="570" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" font-weight="900" fill="#991b1b">상열하한 (上熱下寒)</text>
  <text x="160" y="590" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="10.5" font-weight="600" fill="#475569">두면부·흉격 열감 및 두근거림</text>
  <text x="160" y="606" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="10.5" font-weight="600" fill="#475569">복부·수족 냉증 및 미주신경 저하</text>
  <text x="160" y="624" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="10.5" font-weight="800" fill="#dc2626">→ 수승화강(水昇火降) 조율</text>

  <rect x="266" y="550" width="188" height="84" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
  <text x="360" y="570" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" font-weight="900" fill="#92400e">간기울결 · 담화(痰火)</text>
  <text x="360" y="590" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="10.5" font-weight="600" fill="#475569">흉협고만 압통 및 현맥(弦脈)</text>
  <text x="360" y="606" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="10.5" font-weight="600" fill="#475569">편도체 과각성 · 예민 · 불면</text>
  <text x="360" y="624" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="10.5" font-weight="800" fill="#d97706">→ 소간해울·청뇌진정 처방</text>

  <rect x="466" y="550" width="188" height="84" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="560" y="570" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" font-weight="900" fill="#166534">심담허겁 · 비기허(脾氣虛)</text>
  <text x="560" y="590" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="10.5" font-weight="600" fill="#475569">심하비경 및 제하박동 촉진</text>
  <text x="560" y="606" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="10.5" font-weight="600" fill="#475569">잦은 놀람 · 예기불안 · 위장무력</text>
  <text x="560" y="624" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="10.5" font-weight="800" fill="#15803d">→ 온담안신·보비익기 처방</text>

  <!-- Bottom Clinical Summary -->
  <rect x="52" y="660" width="616" height="72" rx="6" fill="#f0fdfa" stroke="#146369" stroke-width="1.5"/>
  <text x="68" y="682" font-family="'Pretendard', sans-serif" font-size="12.5" font-weight="900" fill="#0c4349">■ 한의학적 사진합참(四診合參) 종합 소견</text>
  <text x="68" y="702" font-family="'Pretendard', sans-serif" font-size="11.5" font-weight="600" fill="#334155">• 복진상 전중혈 압통·흉협고만·심하비경이 뚜렷하고 맥진상 현세삭맥이 관찰되어 뇌-장 축(Gut-Brain Axis) 긴장도가 높음.</text>
  <text x="68" y="720" font-family="'Pretendard', sans-serif" font-size="11.5" font-weight="600" fill="#334155">• 체질 및 장부 허실에 맞춘 1:1 맞춤 한약과 약침·침구 치료로 울체된 기혈을 풀고 뇌신경계 자생력을 근원적으로 복원함.</text>
</svg>
