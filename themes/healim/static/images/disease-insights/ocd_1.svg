<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_bg_18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>
    <linearGradient id="grad_motif_18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#581C87" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="grid_18" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" fill="url(#grad_bg_18)" />
  <rect width="500" height="300" fill="url(#grid_18)" />

  <!-- Ambient light glow -->
  <circle cx="360" cy="150" r="130" fill="#C084FC" opacity="0.12" filter="blur(30px)" />
  <circle cx="80" cy="60" r="90" fill="#C084FC" opacity="0.08" filter="blur(20px)" />

  <!-- Left Content Block -->
  <g transform="translate(36, 48)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="rgba(192,132,252,0.18)" stroke="#C084FC" stroke-width="1.2" />
    <circle cx="12" cy="13" r="3.5" fill="#C084FC" />
    <text x="24" y="17" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="700" letter-spacing="-0.2px">CSTC 루프 진단</text>

    <!-- Title -->
    <text x="0" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5px">
      안와전두엽-선조체 과활성
    </text>

    <!-- Subtitle (word wrapped) -->
    <text x="0" y="98" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500" line-height="1.5">
      멈추지 않는 침투적 불안 생각의 뇌 신경회로
    </text>
    <text x="0" y="118" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500">
       오작동 기전
    </text>

    <!-- Clinical Spec Pill -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="10" y="15" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600">
        HEALIM CLINICAL LAB
      </text>
    </g>
  </g>

  <!-- Right Motif Illustration -->
  
        <g transform="translate(340, 150)">
          <!-- CSTC Triad Loop -->
          <ellipse cx="0" cy="0" rx="50" ry="35" fill="none" stroke="#C084FC" stroke-width="3" stroke-dasharray="6,4"/>
          <!-- 3 Brain Region Nodes -->
          <circle cx="-35" cy="18" r="14" fill="#C084FC"/>
          <text x="-35" y="22" fill="#FFF" font-size="8" font-weight="bold" text-anchor="middle">안와</text>
          <circle cx="35" cy="18" r="14" fill="#C084FC"/>
          <text x="35" y="22" fill="#FFF" font-size="8" font-weight="bold" text-anchor="middle">선조</text>
          <circle cx="0" cy="-35" r="14" fill="#FFF"/>
          <text x="0" y="-31" fill="#0C4349" font-size="8" font-weight="bold" text-anchor="middle">시상</text>
        </g>
        
</svg>