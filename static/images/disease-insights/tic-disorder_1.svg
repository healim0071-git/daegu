<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_bg_0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C5C" />
      <stop offset="100%" stop-color="#0C2E38" />
    </linearGradient>
    <linearGradient id="grad_motif_0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F4C5C" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="grid_0" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" fill="url(#grad_bg_0)" />
  <rect width="500" height="300" fill="url(#grid_0)" />

  <!-- Ambient light glow -->
  <circle cx="360" cy="150" r="130" fill="#00B4D8" opacity="0.12" filter="blur(30px)" />
  <circle cx="80" cy="60" r="90" fill="#00B4D8" opacity="0.08" filter="blur(20px)" />

  <!-- Left Content Block -->
  <g transform="translate(36, 48)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="rgba(0,180,216,0.18)" stroke="#00B4D8" stroke-width="1.2" />
    <circle cx="12" cy="13" r="3.5" fill="#00B4D8" />
    <text x="24" y="17" fill="#90E0EF" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="700" letter-spacing="-0.2px">두뇌 신경망 신호 분석</text>

    <!-- Title -->
    <text x="0" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5px">
      기저핵 · 운동피질 신경 전달
    </text>

    <!-- Subtitle (word wrapped) -->
    <text x="0" y="98" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500" line-height="1.5">
      대뇌 기저핵 도파민 회로의 일시적 불균형 신
    </text>
    <text x="0" y="118" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500">
      호 감지
    </text>

    <!-- Clinical Spec Pill -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="10" y="15" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600">
        HEALIM CLINICAL LAB
      </text>
    </g>
  </g>

  <!-- Right Motif Illustration -->
  
        <g transform="translate(340, 150)">
          <circle cx="0" cy="0" r="60" fill="none" stroke="#00B4D8" stroke-width="2" stroke-dasharray="4,4" opacity="0.4"/>
          <circle cx="0" cy="0" r="42" fill="url(#grad_motif_0)" opacity="0.85"/>
          <path d="M-25,-15 Q0,-35 25,-15 Q35,10 15,25 Q-10,35 -25,10 Z" fill="#00B4D8" opacity="0.9"/>
          <!-- neural nodes -->
          <circle cx="-15" cy="-5" r="5" fill="#FFF"/>
          <circle cx="12" cy="8" r="6" fill="#FFF"/>
          <circle cx="0" cy="20" r="4" fill="#FFF"/>
          <line x1="-15" y1="-5" x2="12" y2="8" stroke="#FFF" stroke-width="2"/>
          <line x1="12" y1="8" x2="0" y2="20" stroke="#FFF" stroke-width="2"/>
          <!-- impulse waves -->
          <path d="M45,-25 Q65,0 45,25" fill="none" stroke="#00B4D8" stroke-width="3" stroke-linecap="round"/>
          <path d="M60,-35 Q85,0 60,35" fill="none" stroke="#00B4D8" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>
        </g>
        
</svg>