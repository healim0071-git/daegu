<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_bg_23" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2C" />
    </linearGradient>
    <linearGradient id="grad_motif_23" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="grid_23" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" fill="url(#grad_bg_23)" />
  <rect width="500" height="300" fill="url(#grid_23)" />

  <!-- Ambient light glow -->
  <circle cx="360" cy="150" r="130" fill="#FACC15" opacity="0.12" filter="blur(30px)" />
  <circle cx="80" cy="60" r="90" fill="#FACC15" opacity="0.08" filter="blur(20px)" />

  <!-- Left Content Block -->
  <g transform="translate(36, 48)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="rgba(250,204,21,0.18)" stroke="#FACC15" stroke-width="1.2" />
    <circle cx="12" cy="13" r="3.5" fill="#FACC15" />
    <text x="24" y="17" fill="#FEF08A" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="700" letter-spacing="-0.2px">심신 이완 골든타임</text>

    <!-- Title -->
    <text x="0" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5px">
      중추성 이완 반응 활성화
    </text>

    <!-- Subtitle (word wrapped) -->
    <text x="0" y="98" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500" line-height="1.5">
      뇌파 안정화와 자율신경 균형으로 마음의 평정
    </text>
    <text x="0" y="118" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500">
      심 복원
    </text>

    <!-- Clinical Spec Pill -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="10" y="15" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600">
        HEALIM CLINICAL LAB
      </text>
    </g>
  </g>

  <!-- Right Motif Illustration -->
  
        <g transform="translate(340, 150)">
          <!-- Protective Resilience Shield -->
          <path d="M0,-45 L40,-25 C40,15 20,45 0,55 C-20,45 -40,15 -40,-25 Z" fill="url(#grad_motif_23)" stroke="#FACC15" stroke-width="3"/>
          <circle cx="0" cy="5" r="16" fill="#FACC15"/>
          <!-- Inner calm heart/lotus spark -->
          <path d="M0,-5 C5,-15 15,-10 10,2 C5,8 0,15 0,15 C0,15 -5,8 -10,2 C-15,-10 -5,-15 0,-5 Z" fill="#FFF"/>
        </g>
        
</svg>