      "mainEntity": [
        {
          "@type": "Question",
          "name": "틱장애·공황장애·자율신경실조증, 왜 단순 신경 안정제 복용만으로는 반복 재발할까요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "틱장애, 공황장애, 만성 자율신경실조증 등 뇌신경계 질환이 약물 치료 후에도 반복 재발하는 핵심 원인은 일시적 신경 억제 약물이 뇌 피질-선조체-시상(CSTC) 신경망의 운동 여과 불균형과 편도체(Amygdala)의 과각성을 근본적으로 안정시키지 못하기 때문입니다. 항불안제나 중추 억제제는 신경 전달 신호를 일시적으로 둔화시킬 뿐, 스트레스나 피로 등 외부 자극에 스스로 대응하는 ‘두뇌 고유의 완충 자생력’을 형성하지 못합니다. 따라서 보건복지부 및 건강보험심사평가원 임상 데이터와 대한한방신경정신과학회 표준 진료지침에 근거하여, 개인별 장부 허실을 보하고 편도체 과열을 진정시키는 1:1 맞춤 한약과 두뇌 훈련을 병행하여 신경망 고유의 자율 회복력을 길러주는 것이 재발 방지의 결정적 해답입니다."
          }
        },
        {
          "@type": "Question",
          "name": "초등학생 자녀의 틱 증상이 비염이나 알레르기 결막염과 겹칠 때는 어떻게 구분하나요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "학령기 아동에서 틱 증상과 알레르기 질환은 겉으로 보기에 유사하지만 신경학적 발생 기전에는 명확한 차이가 있습니다. 비염이나 결막염 환아는 코점막의 충혈이나 안구 결막의 소양감, 통증 등 국소 부위의 물리적 불편함을 직접 호소하며, 항히스타민제나 안약 등 알레르기 약물을 투여하면 가려움과 함께 깜빡임이 즉각 완화됩니다. 반면 틱 증상은 물리적 가려움보다는 눈이나 목 안쪽이 답답하고 찝찝하여 움직이지 않고는 견디기 힘든 불수의적 신경 충동(전조 감각 충동, Premonitory Urge)에 의해 무의식적으로 행해집니다. 또한 학습 스트레스, 피로, 긴장 상황이나 반대로 긴장이 풀리는 저녁 시간대에 증상 빈도가 급증하는 신경학적 변동성을 보입니다. 해아림한의원 대구본점에서는 풍담(風痰)이 뇌신경계로 상충하여 기저핵-시상 회로의 운동 여과 기능이 저하된 것으로 변증하며, 신경 과각성을 가라앉히는 소아 맞춤 한약과 두경부 근막 이완 치료를 적용합니다."
          }
        },
        {
          "@type": "Question",
          "name": "가만히 쉬고 있을 때도 갑자기 심장이 터질 듯 뛰고 숨이 막힙니다. 응급실 검사는 정상인데 정말 공황장애인가요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "심장내과나 응급실 검사상 정상 판정을 받는 이유는 심장이나 폐의 기질적 파괴가 아니라, 뇌 편도체의 오작동으로 자율신경계에 비상 사이렌이 울린 '기능적 교감신경 폭풍'이기 때문입니다. 교감신경이 급격히 항진되면 심장이 분당 130회 이상 뛰고 과호흡으로 인해 가슴 통증과 질식감이 발생하지만, 이는 위험한 심장마비가 아니므로 안심하셔도 좋습니다. 4-6 구순 복식호흡과 5-4-3-2-1 감각 그라운딩을 시행하면 10~15분 내로 뇌간 경보가 진정됩니다. 해아림한의원 대구본점에서는 뇌파(QEEG) 및 HRV 자율신경 검사로 신경계 불균형을 정밀 진단하고, 청심온담탕 가감 처방과 두개천골요법(CST)으로 편도체 과열을 정상화합니다."
          }
        },
        {
          "@type": "Question",
          "name": "잠들기 힘들고 자다 깨면 다시 잠 못 드는 만성 불면증, 수면제 없이 치료 가능한가요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "수면제나 수면유도제는 뇌 중추를 인위적으로 마비시키는 방식으로, 장기 복용 시 약물 내성과 낮 시간대 몽롱함, 의존성이 발생하기 쉽습니다. 한의학에서는 뇌의 상열감(上熱感)과 심장의 화(火)를 식히고 하초의 기운을 보강하는 수승화강(水昇火降) 원리를 통해 뇌파가 자연스럽게 수면 델타파로 유도되도록 돕습니다. 산조인탕, 귀비탕 맞춤 한약과 이완 훈련으로 수면제 없이도 스스로 깊은 잠에 드는 뇌 자생력을 되찾아 드립니다."
          }
        },
        {
          "@type": "Question",
          "name": "병원 검사상 아무 이상이 없다는데 어지럼증과 가슴 두근거림, 소화불량이 지속됩니다. 자율신경실조증인가요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "내과, 신경과, 이비인후과 등에서 CT나 혈액 검사를 받아도 '이상 없음'이 나오는데 두통, 기립성 어지럼, 위장 무력, 식은땀이 반복된다면 뇌-자율신경계 조절 시스템 이상인 자율신경실조증(Dysautonomia)일 가능성이 매우 높습니다. 교감신경과 부교감신경의 시소 균형이 깨지면 혈관 수축과 내장 평활근 조절 기능이 떨어져 전신 증상이 동시다발적으로 나타납니다. 해아림한의원 대구본점에서는 HRV 정밀 검사와 경추-두개골 이완, 뇌신경계 순환 한약으로 무너진 자율신경 리듬을 회복시킵니다."
          }
        }
      ]
    }

    {{- $slug := strings.Trim .RelPermalink "/" }}

    {
      "@type": "MedicalWebPage",
      "@id": "{{ .Permalink }}#webpage",
      "url": "{{ .Permalink }}",
      "name": "{{ .Title }}",
      "description": "{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}",
      "author": {"@id": "{{ .Site.BaseURL }}#physician"},
      "publisher": {"@id": "{{ .Site.BaseURL }}#clinic"},
      "about": {
        "@type": "MedicalCondition",
        "name": "{{ .Title }}"
      }
    }
    {{- $faqs := index site.Data.disease_faqs $slug }}
    {{- if not $faqs }}
      {{- $faqs = index site.Data.disease_faqs (path.Base .RelPermalink) }}
    {{- end }}
    {{- if $faqs }}
    ,
    {
      "@type": "FAQPage",
      "@id": "{{ .Permalink }}#faq",
      "mainEntity": [
        {{- range $idx, $faq := $faqs }}
        {{- if gt $idx 0 }},{{- end }}
        {
          "@type": "Question",
          "name": {{ $faq.q | jsonify }},
          "acceptedAnswer": {
            "@type": "Answer",
            "text": {{ $faq.a | jsonify }}
          }

      ]

    {{- end }}
    {{- end }}
    {{- if and (eq .Section "columns") .IsPage }}
    ,
    {
      "@type": "Article",
      "@id": "{{ .Permalink }}#article",
      "headline": "{{ .Title }}",
      "description": "{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}",
      "url": "{{ .Permalink }}",
      "author": {"@id": "{{ .Site.BaseURL }}#physician"},
      "publisher": {"@id": "{{ .Site.BaseURL }}#clinic"},
      "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
      "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
      "mainEntityOfPage": "{{ .Permalink }}"
    }
    {{- end }}
    {{- if not .IsHome }}
    ,
    {
      "@type": "BreadcrumbList",
      "@id": "{{ .Permalink }}#breadcrumb",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "홈",
          "item": "{{ .Site.BaseURL }}"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "{{ .Title }}",
          "item": "{{ .Permalink }}"
        }
      ]
    }
    {{- end }}
  ]
}
</script>
