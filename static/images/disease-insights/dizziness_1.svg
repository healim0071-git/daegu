<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_bg_12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="100%" stop-color="#032E45" />
    </linearGradient>
    <linearGradient id="grad_motif_12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#075985" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="grid_12" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" fill="url(#grad_bg_12)" />
  <rect width="500" height="300" fill="url(#grid_12)" />

  <!-- Ambient light glow -->
  <circle cx="360" cy="150" r="130" fill="#38BDF8" opacity="0.12" filter="blur(30px)" />
  <circle cx="80" cy="60" r="90" fill="#38BDF8" opacity="0.08" filter="blur(20px)" />

  <!-- Left Content Block -->
  <g transform="translate(36, 48)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="rgba(56,189,248,0.18)" stroke="#38BDF8" stroke-width="1.2" />
    <circle cx="12" cy="13" r="3.5" fill="#38BDF8" />
    <text x="24" y="17" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="700" letter-spacing="-0.2px">평형감각 통합 분석</text>

    <!-- Title -->
    <text x="0" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5px">
      전정신경 · 반고리관 기전
    </text>

    <!-- Subtitle (word wrapped) -->
    <text x="0" y="98" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500" line-height="1.5">
      귓속 전정기관과 시각·경추 고유수용성 감각 
    </text>
    <text x="0" y="118" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500">
      불일치 진단
    </text>

    <!-- Clinical Spec Pill -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="10" y="15" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600">
        HEALIM CLINICAL LAB
      </text>
    </g>
  </g>

  <!-- Right Motif Illustration -->
  
        <g transform="translate(340, 150)">
          <!-- Inner ear semicircular canal 3 loops -->
          <path d="M0,0 C-40,-50 -10,-60 0,-20 C10,-60 40,-50 0,0" fill="none" stroke="#38BDF8" stroke-width="3"/>
          <path d="M0,0 C-60,-10 -50,20 -15,10 C-50,40 -20,50 0,0" fill="none" stroke="#38BDF8" stroke-width="3"/>
          <circle cx="0" cy="0" r="14" fill="#FFF"/>
          <circle cx="0" cy="0" r="8" fill="#38BDF8"/>
          <!-- Gyro rings -->
          <ellipse cx="0" cy="0" rx="55" ry="20" fill="none" stroke="#FFF" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
        </g>
        
</svg>