<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_bg_clim2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#0F051D" />
    </linearGradient>
    <linearGradient id="grad_motif_clim2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6B21A8" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="grid_clim2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="500" height="300" fill="url(#grad_bg_clim2)" />
  <rect width="500" height="300" fill="url(#grid_clim2)" />

  <circle cx="360" cy="150" r="130" fill="#A855F7" opacity="0.12" filter="blur(30px)" />
  <circle cx="80" cy="60" r="90" fill="#A855F7" opacity="0.08" filter="blur(20px)" />

  <g transform="translate(36, 48)">
    <rect x="0" y="0" width="170" height="26" rx="13" fill="rgba(168,85,247,0.18)" stroke="#A855F7" stroke-width="1.2" />
    <circle cx="12" cy="13" r="3.5" fill="#A855F7" />
    <text x="24" y="17" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="700" letter-spacing="-0.2px">뇌신경망 &amp; 수면 리듬</text>

    <text x="0" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5px">
      세로토닌 &amp; 멜라토닌 리듬
    </text>

    <text x="0" y="98" fill="rgba(255,255,255,0.75)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500">
      정서 조절 회로와 서파수면(Delta파)
    </text>
    <text x="0" y="118" fill="rgba(255,255,255,0.75)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500">
      자생력 회복 프로세스
    </text>

    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="10" y="15" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600">
        HEALIM NEURO LAB
      </text>
    </g>
  </g>

  <g transform="translate(345, 145)">
    <!-- Crescent Moon & Neural Wave -->
    <path d="M-15,-40 A32,32 0 0,0 20,-5 A28,28 0 1,1 -15,-40 Z" fill="#C084FC" opacity="0.95"/>
    <circle cx="30" cy="-30" r="3" fill="#FFF"/>
    <circle cx="-30" cy="-10" r="2" fill="#E9D5FF"/>
    <path d="M-55,30 Q-30,10 0,30 Q30,50 55,30" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M-50,45 Q-25,35 0,45 Q25,55 50,45" fill="none" stroke="#A855F7" stroke-width="2" opacity="0.7"/>
  </g>
</svg>