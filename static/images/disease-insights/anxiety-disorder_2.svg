<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_bg_22" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="grad_motif_22" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="grid_22" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" fill="url(#grad_bg_22)" />
  <rect width="500" height="300" fill="url(#grid_22)" />

  <!-- Ambient light glow -->
  <circle cx="360" cy="150" r="130" fill="#FB7185" opacity="0.12" filter="blur(30px)" />
  <circle cx="80" cy="60" r="90" fill="#FB7185" opacity="0.08" filter="blur(20px)" />

  <!-- Left Content Block -->
  <g transform="translate(36, 48)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="rgba(251,113,133,0.18)" stroke="#FB7185" stroke-width="1.2" />
    <circle cx="12" cy="13" r="3.5" fill="#FB7185" />
    <text x="24" y="17" fill="#FFE4E6" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="700" letter-spacing="-0.2px">신체 긴장 확산</text>

    <!-- Title -->
    <text x="0" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5px">
      근긴장·호흡압박·장신경
    </text>

    <!-- Subtitle (word wrapped) -->
    <text x="0" y="98" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500" line-height="1.5">
      불안이 신체화되어 목·어깨 결림, 소화불량으
    </text>
    <text x="0" y="118" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500">
      로 이어지는 추이
    </text>

    <!-- Clinical Spec Pill -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="10" y="15" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600">
        HEALIM CLINICAL LAB
      </text>
    </g>
  </g>

  <!-- Right Motif Illustration -->
  
        <g transform="translate(340, 150)">
          <!-- Human torso silhouette with tension nodes -->
          <path d="M-20,-45 C-10,-45 10,-45 20,-45 C25,-25 35,-10 35,45 L-35,45 C-35,-10 -25,-25 -20,-45 Z" fill="url(#grad_motif_22)" opacity="0.5"/>
          <!-- Tension nodes: neck, chest, stomach -->
          <circle cx="0" cy="-30" r="7" fill="#FB7185"/>
          <circle cx="0" cy="-5" r="9" fill="#EF4444"/>
          <circle cx="0" cy="22" r="8" fill="#FB7185"/>
          <line x1="0" y1="-30" x2="0" y2="22" stroke="#FFF" stroke-width="2" stroke-dasharray="3,3"/>
        </g>
        
</svg>