<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_bg_15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730A3" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="grad_motif_15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3730A3" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="grid_15" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" fill="url(#grad_bg_15)" />
  <rect width="500" height="300" fill="url(#grid_15)" />

  <!-- Ambient light glow -->
  <circle cx="360" cy="150" r="130" fill="#818CF8" opacity="0.12" filter="blur(30px)" />
  <circle cx="80" cy="60" r="90" fill="#818CF8" opacity="0.08" filter="blur(20px)" />

  <!-- Left Content Block -->
  <g transform="translate(36, 48)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="rgba(129,140,248,0.18)" stroke="#818CF8" stroke-width="1.2" />
    <circle cx="12" cy="13" r="3.5" fill="#818CF8" />
    <text x="24" y="17" fill="#C7D2FE" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="700" letter-spacing="-0.2px">주의망 필터 진단</text>

    <!-- Title -->
    <text x="0" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5px">
      전전두엽 도파민 회로 분석
    </text>

    <!-- Subtitle (word wrapped) -->
    <text x="0" y="98" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500" line-height="1.5">
      외부 자극 필터링과 작업기억을 담당하는 전두
    </text>
    <text x="0" y="118" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500">
      엽 주의망
    </text>

    <!-- Clinical Spec Pill -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="10" y="15" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600">
        HEALIM CLINICAL LAB
      </text>
    </g>
  </g>

  <!-- Right Motif Illustration -->
  
        <g transform="translate(340, 150)">
          <!-- Focus spotlight filtering beam -->
          <polygon points="0,-45 -45,45 45,45" fill="url(#grad_motif_15)" opacity="0.6"/>
          <!-- Central brain focus node -->
          <circle cx="0" cy="-10" r="22" fill="#818CF8"/>
          <circle cx="0" cy="-10" r="10" fill="#FFF"/>
          <!-- Dopamine spark particles -->
          <circle cx="-30" cy="-25" r="4" fill="#FACC15"/>
          <circle cx="28" cy="-28" r="5" fill="#FACC15"/>
          <circle cx="35" cy="15" r="4" fill="#FACC15"/>
          <line x1="0" y1="-10" x2="-30" y2="-25" stroke="#FACC15" stroke-width="1.5" stroke-dasharray="2,2"/>
          <line x1="0" y1="-10" x2="28" y2="-28" stroke="#FACC15" stroke-width="1.5" stroke-dasharray="2,2"/>
        </g>
        
</svg>