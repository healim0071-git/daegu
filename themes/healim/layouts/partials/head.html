<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .Params.seo_title }}{{ .Params.seo_title }}{{ else if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  {{ with .Params.keywords }}<meta name="keywords" content="{{ if (reflect.IsSlice .) }}{{ delimit . ", " }}{{ else }}{{ . }}{{ end }}">
  {{ else }}{{ with .Site.Params.keywords }}<meta name="keywords" content="{{ . }}">
  {{ end }}{{ end }}<meta name="robots" content="index, follow">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">

  <!-- Naver Site Verification -->
  <meta name="naver-site-verification" content="54bdb91194fe192a07777afff7babb5894b57c4f" />
  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="jezJlLZCsNloa04nfC1qISjJK45zVviWzr--kmXZjgk" />

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ if .Params.seo_title }}{{ .Params.seo_title }}{{ else if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:site_name" content="해아림한의원 대구본점">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ if .Params.seo_title }}{{ .Params.seo_title }}{{ else if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">

  <!-- Font & CSS (healimsc.com 동일: 고운바탕 + Noto Serif KR + 프리텐다드 가변웹폰트) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@300;600;700;900&display=swap">
  <link rel="stylesheet" href="/css/style.css">

  <!-- Favicon (해아림 공식 로고) -->
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/images/favicon.png">

  {{ partial "schema.html" . }}
  <!-- Healim LocalStorage Bulletproof Shield: 치료칼럼 및 FAQ 영구 보존 보호 장치 -->
  <script>
  (function() {
    if (window._healimStorageShieldInstalled) return;
    window._healimStorageShieldInstalled = true;

    // 1. 칼럼 및 FAQ 데이터 삭제(removeItem) 시도 원천 차단
    var origRemoveItem = Storage.prototype.removeItem;
    Storage.prototype.removeItem = function(key) {
      if (key === 'healim_board_columns' || key === 'healim_board_faqs' || key === 'healim_board_columns_permanent_backup' || key === 'healim_board_faqs_permanent_backup') {
        console.warn('[Healim Storage Shield] Blocked unauthorized removeItem:', key);
        return;
      }
      return origRemoveItem.apply(this, arguments);
    };

    // 2. 구버전 캐시 스크립트의 빈 배열/누락 덮어쓰기 원천 방지 및 자동 복원 병합
    var origSetItem = Storage.prototype.setItem;
    Storage.prototype.setItem = function(key, val) {
      if (key === 'healim_board_columns' || key === 'healim_board_faqs' || key === 'healim_board_columns_permanent_backup' || key === 'healim_board_faqs_permanent_backup') {
        try {
          var currentRaw = localStorage.getItem(key);
          if (currentRaw) {
            var currArr = JSON.parse(currentRaw);
            var newArr = (typeof val === 'string') ? JSON.parse(val) : val;
            if (Array.isArray(currArr) && currArr.length > 0 && Array.isArray(newArr)) {
              var delKey = (key === 'healim_board_columns') ? 'healim_deleted_column_ids' : 'healim_deleted_faq_ids';
              var delRaw = localStorage.getItem(delKey);
              var delList = delRaw ? JSON.parse(delRaw) : [];
              if (!Array.isArray(delList)) delList = [];

              currArr.forEach(function(existingItem) {
                if (!existingItem || !existingItem.id) return;
                var isDeleted = delList.includes(existingItem.id) || (existingItem.title && delList.includes(existingItem.title)) || (existingItem.q && delList.includes(existingItem.q));
                if (isDeleted) return;

                var existsInNew = newArr.some(function(p) {
                  return p && (p.id === existingItem.id || (existingItem.title && p.title === existingItem.title) || (existingItem.q && p.q === existingItem.q));
                });
                if (!existsInNew) {
                  newArr.unshift(existingItem);
                }
              });
              val = JSON.stringify(newArr);
            }
          }
        } catch(e) {}
      }
      return origSetItem.apply(this, [key, val]);
    };
  })();
  </script>
</head>
