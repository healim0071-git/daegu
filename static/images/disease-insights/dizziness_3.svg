<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_bg_14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2C" />
    </linearGradient>
    <linearGradient id="grad_motif_14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="grid_14" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" fill="url(#grad_bg_14)" />
  <rect width="500" height="300" fill="url(#grid_14)" />

  <!-- Ambient light glow -->
  <circle cx="360" cy="150" r="130" fill="#2DD4BF" opacity="0.12" filter="blur(30px)" />
  <circle cx="80" cy="60" r="90" fill="#2DD4BF" opacity="0.08" filter="blur(20px)" />

  <!-- Left Content Block -->
  <g transform="translate(36, 48)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="rgba(45,212,191,0.18)" stroke="#2DD4BF" stroke-width="1.2" />
    <circle cx="12" cy="13" r="3.5" fill="#2DD4BF" />
    <text x="24" y="17" fill="#99F6E4" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="700" letter-spacing="-0.2px">감각통합 재활</text>

    <!-- Title -->
    <text x="0" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5px">
      전정안구반사(VOR) 회복 적기
    </text>

    <!-- Subtitle (word wrapped) -->
    <text x="0" y="98" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500" line-height="1.5">
      중추 신경계의 시선 고정력 및 회전 평형 보
    </text>
    <text x="0" y="118" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500">
      정 회로 강화
    </text>

    <!-- Clinical Spec Pill -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="10" y="15" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600">
        HEALIM CLINICAL LAB
      </text>
    </g>
  </g>

  <!-- Right Motif Illustration -->
  
        <g transform="translate(340, 150)">
          <!-- Gyroscope Balance Target -->
          <circle cx="0" cy="0" r="50" fill="none" stroke="#2DD4BF" stroke-width="2"/>
          <circle cx="0" cy="0" r="34" fill="none" stroke="#FFF" stroke-width="1.5" stroke-dasharray="4,4"/>
          <line x1="-55" y1="0" x2="55" y2="0" stroke="#2DD4BF" stroke-width="2"/>
          <line x1="0" y1="-55" x2="0" y2="55" stroke="#2DD4BF" stroke-width="2"/>
          <!-- Horizon crosshair balanced -->
          <polygon points="0,-25 6,-5 25,0 6,5 0,25 -6,5 -25,0 -6,-5" fill="#2DD4BF"/>
          <circle cx="0" cy="0" r="5" fill="#FFF"/>
        </g>
        
</svg>