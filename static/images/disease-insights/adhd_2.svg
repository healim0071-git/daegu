<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_bg_16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <linearGradient id="grad_motif_16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9A3412" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="grid_16" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" fill="url(#grad_bg_16)" />
  <rect width="500" height="300" fill="url(#grid_16)" />

  <!-- Ambient light glow -->
  <circle cx="360" cy="150" r="130" fill="#FB923C" opacity="0.12" filter="blur(30px)" />
  <circle cx="80" cy="60" r="90" fill="#FB923C" opacity="0.08" filter="blur(20px)" />

  <!-- Left Content Block -->
  <g transform="translate(36, 48)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="rgba(251,146,60,0.18)" stroke="#FB923C" stroke-width="1.2" />
    <circle cx="12" cy="13" r="3.5" fill="#FB923C" />
    <text x="24" y="17" fill="#FFEDD5" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="700" letter-spacing="-0.2px">집행기능 지연</text>

    <!-- Title -->
    <text x="0" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5px">
      충동 억제 기전과 분산 추이
    </text>

    <!-- Subtitle (word wrapped) -->
    <text x="0" y="98" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500" line-height="1.5">
      행동 억제 실패 및 시간 관리·조직화 능력 
    </text>
    <text x="0" y="118" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500">
      저하의 양상
    </text>

    <!-- Clinical Spec Pill -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="10" y="15" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600">
        HEALIM CLINICAL LAB
      </text>
    </g>
  </g>

  <!-- Right Motif Illustration -->
  
        <g transform="translate(340, 150)">
          <!-- Gate Mechanism controlling impulsive vectors -->
          <rect x="-40" y="-30" width="80" height="60" rx="8" fill="none" stroke="#FB923C" stroke-width="2"/>
          <!-- Filter Bars -->
          <line x1="-15" y1="-25" x2="-15" y2="25" stroke="#FB923C" stroke-width="4" stroke-linecap="round"/>
          <line x1="15" y1="-25" x2="15" y2="25" stroke="#FB923C" stroke-width="4" stroke-linecap="round"/>
          <!-- Stopped signal vs passed signal -->
          <path d="M-60,-10 L-25,-10" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
          <circle cx="-25" cy="-10" r="6" fill="#EF4444"/>
          <path d="M15,10 L55,10" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
          <polygon points="55,10 47,5 47,15" fill="#10B981"/>
        </g>
        
</svg>