<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_bg_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D3557" />
      <stop offset="100%" stop-color="#0E1E34" />
    </linearGradient>
    <linearGradient id="grad_motif_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1D3557" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="grid_1" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" fill="url(#grad_bg_1)" />
  <rect width="500" height="300" fill="url(#grid_1)" />

  <!-- Ambient light glow -->
  <circle cx="360" cy="150" r="130" fill="#E63946" opacity="0.12" filter="blur(30px)" />
  <circle cx="80" cy="60" r="90" fill="#E63946" opacity="0.08" filter="blur(20px)" />

  <!-- Left Content Block -->
  <g transform="translate(36, 48)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="rgba(230,57,70,0.18)" stroke="#E63946" stroke-width="1.2" />
    <circle cx="12" cy="13" r="3.5" fill="#E63946" />
    <text x="24" y="17" fill="#FFA69E" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="700" letter-spacing="-0.2px">만성화 기전 추적</text>

    <!-- Title -->
    <text x="0" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5px">
      감각충동 (Urge) 진행 경로
    </text>

    <!-- Subtitle (word wrapped) -->
    <text x="0" y="98" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500" line-height="1.5">
      근육 틱에서 음성 틱으로의 전환 및 신경 피
    </text>
    <text x="0" y="118" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500">
      로도 누적 분석
    </text>

    <!-- Clinical Spec Pill -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="10" y="15" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600">
        HEALIM CLINICAL LAB
      </text>
    </g>
  </g>

  <!-- Right Motif Illustration -->
  
        <g transform="translate(340, 150)">
          <!-- hierarchical pathway -->
          <circle cx="-35" cy="-40" r="14" fill="#E63946" opacity="0.9"/>
          <circle cx="35" cy="-40" r="14" fill="#E63946" opacity="0.9"/>
          <circle cx="0" cy="15" r="18" fill="url(#grad_motif_1)"/>
          <circle cx="-40" cy="55" r="10" fill="#E63946" opacity="0.6"/>
          <circle cx="40" cy="55" r="10" fill="#E63946" opacity="0.6"/>
          <line x1="-35" y1="-40" x2="0" y2="15" stroke="#E63946" stroke-width="3"/>
          <line x1="35" y1="-40" x2="0" y2="15" stroke="#E63946" stroke-width="3"/>
          <line x1="0" y1="15" x2="-40" y2="55" stroke="#E63946" stroke-width="2" stroke-dasharray="3,3"/>
          <line x1="0" y1="15" x2="40" y2="55" stroke="#E63946" stroke-width="2" stroke-dasharray="3,3"/>
          <text x="-35" y="-36" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">운동</text>
          <text x="35" y="-36" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">음성</text>
          <text x="0" y="19" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">충동</text>
        </g>
        
</svg>