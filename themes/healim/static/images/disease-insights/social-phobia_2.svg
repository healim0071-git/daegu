<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_bg_28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="grad_motif_28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="grid_28" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" fill="url(#grad_bg_28)" />
  <rect width="500" height="300" fill="url(#grid_28)" />

  <!-- Ambient light glow -->
  <circle cx="360" cy="150" r="130" fill="#F59E0B" opacity="0.12" filter="blur(30px)" />
  <circle cx="80" cy="60" r="90" fill="#F59E0B" opacity="0.08" filter="blur(20px)" />

  <!-- Left Content Block -->
  <g transform="translate(36, 48)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="rgba(245,158,11,0.18)" stroke="#F59E0B" stroke-width="1.2" />
    <circle cx="12" cy="13" r="3.5" fill="#F59E0B" />
    <text x="24" y="17" fill="#FDE68A" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="700" letter-spacing="-0.2px">상황 회피 심화</text>

    <!-- Title -->
    <text x="0" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5px">
      안전행동과 사회적 위축
    </text>

    <!-- Subtitle (word wrapped) -->
    <text x="0" y="98" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500" line-height="1.5">
      모임이나 발표 상황을 피하면서 대인관계 반경
    </text>
    <text x="0" y="118" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500">
      이 축소되는 과정
    </text>

    <!-- Clinical Spec Pill -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="10" y="15" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600">
        HEALIM CLINICAL LAB
      </text>
    </g>
  </g>

  <!-- Right Motif Illustration -->
  
        <g transform="translate(340, 150)">
          <!-- Shrinking comfort zones -->
          <circle cx="0" cy="0" r="55" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>
          <circle cx="0" cy="0" r="38" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4" opacity="0.7"/>
          <circle cx="0" cy="0" r="22" fill="#F59E0B"/>
          <!-- Figure inside safe sanctuary -->
          <circle cx="0" cy="-4" r="5" fill="#FFF"/>
          <path d="M-8,14 C-8,4 8,4 8,14 Z" fill="#FFF"/>
        </g>
        
</svg>