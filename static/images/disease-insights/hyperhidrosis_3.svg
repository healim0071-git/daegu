<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_bg_26" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="grad_motif_26" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="grid_26" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" fill="url(#grad_bg_26)" />
  <rect width="500" height="300" fill="url(#grid_26)" />

  <!-- Ambient light glow -->
  <circle cx="360" cy="150" r="130" fill="#34D399" opacity="0.12" filter="blur(30px)" />
  <circle cx="80" cy="60" r="90" fill="#34D399" opacity="0.08" filter="blur(20px)" />

  <!-- Left Content Block -->
  <g transform="translate(36, 48)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="rgba(52,211,153,0.18)" stroke="#34D399" stroke-width="1.2" />
    <circle cx="12" cy="13" r="3.5" fill="#34D399" />
    <text x="24" y="17" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="700" letter-spacing="-0.2px">체온·발한 자율조절</text>

    <!-- Title -->
    <text x="0" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5px">
      체질 개선 및 자율신경 조절
    </text>

    <!-- Subtitle (word wrapped) -->
    <text x="0" y="98" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500" line-height="1.5">
      흉부 교감신경 과흥분을 다스려 뽀송하고 쾌적
    </text>
    <text x="0" y="118" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500">
      한 상태 회복
    </text>

    <!-- Clinical Spec Pill -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="10" y="15" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600">
        HEALIM CLINICAL LAB
      </text>
    </g>
  </g>

  <!-- Right Motif Illustration -->
  
        <g transform="translate(340, 150)">
          <!-- Regulated pore with cool breeze lines -->
          <path d="M-45,30 Q-20,30 -15,10 Q0,-15 15,10 Q20,30 45,30" fill="none" stroke="#34D399" stroke-width="3"/>
          <circle cx="0" cy="5" r="14" fill="#34D399"/>
          <circle cx="0" cy="5" r="6" fill="#FFF"/>
          <!-- Cool soothing air breeze -->
          <path d="M-40,-35 Q0,-45 40,-35" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M-30,-20 Q5,-30 40,-20" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
        </g>
        
</svg>