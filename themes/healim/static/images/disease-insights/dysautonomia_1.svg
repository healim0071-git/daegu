<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_bg_6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D" />
      <stop offset="100%" stop-color="#052E16" />
    </linearGradient>
    <linearGradient id="grad_motif_6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#14532D" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="grid_6" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" fill="url(#grad_bg_6)" />
  <rect width="500" height="300" fill="url(#grid_6)" />

  <!-- Ambient light glow -->
  <circle cx="360" cy="150" r="130" fill="#4ADE80" opacity="0.12" filter="blur(30px)" />
  <circle cx="80" cy="60" r="90" fill="#4ADE80" opacity="0.08" filter="blur(20px)" />

  <!-- Left Content Block -->
  <g transform="translate(36, 48)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="rgba(74,222,128,0.18)" stroke="#4ADE80" stroke-width="1.2" />
    <circle cx="12" cy="13" r="3.5" fill="#4ADE80" />
    <text x="24" y="17" fill="#BBF7D0" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="11" font-weight="700" letter-spacing="-0.2px">신경계 시소 밸런스</text>

    <!-- Title -->
    <text x="0" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5px">
      교감 · 부교감 불균형 계측
    </text>

    <!-- Subtitle (word wrapped) -->
    <text x="0" y="98" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500" line-height="1.5">
      원인 불명의 상열감, 소화장애, 가슴두근거림
    </text>
    <text x="0" y="118" fill="rgba(255,255,255,0.72)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="12.5" font-weight="500">
       복합 분석
    </text>

    <!-- Clinical Spec Pill -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="10" y="15" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="10" font-weight="600">
        HEALIM CLINICAL LAB
      </text>
    </g>
  </g>

  <!-- Right Motif Illustration -->
  
        <g transform="translate(340, 150)">
          <!-- Balance Scale -->
          <line x1="0" y1="-45" x2="0" y2="40" stroke="#FFF" stroke-width="4"/>
          <polygon points="0,-45 -10,-35 10,-35" fill="#FFF"/>
          <!-- Cross beam tilted -->
          <line x1="-50" y1="-15" x2="50" y2="5" stroke="#4ADE80" stroke-width="4" stroke-linecap="round"/>
          <circle cx="0" cy="-5" r="8" fill="#FFF"/>
          <!-- Pan 1 (Sympathetic) -->
          <path d="M-50,-15 L-60,15 L-40,15 Z" fill="none" stroke="#4ADE80" stroke-width="2"/>
          <circle cx="-50" cy="18" r="12" fill="#EF4444"/>
          <text x="-50" y="22" fill="#FFF" font-size="9" font-weight="bold" text-anchor="middle">교감</text>
          <!-- Pan 2 (Parasympathetic) -->
          <path d="M50,5 L40,35 L60,35 Z" fill="none" stroke="#4ADE80" stroke-width="2"/>
          <circle cx="50" cy="38" r="12" fill="#10B981"/>
          <text x="50" y="42" fill="#FFF" font-size="9" font-weight="bold" text-anchor="middle">부교</text>
        </g>
        
</svg>