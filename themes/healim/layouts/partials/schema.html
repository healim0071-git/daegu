<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": ["MedicalClinic", "LocalBusiness"],
      "@id": "{{ .Site.BaseURL }}#clinic",
      "name": "해아림한의원 대구본점",
      "alternateName": "Healim Korean Medicine Clinic Daegu",
      "url": "{{ .Site.BaseURL }}",
      "telephone": "+82-53-751-0071",
      "description": "{{ .Site.Params.description }}",
      "medicalSpecialty": "Psychiatric",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "달구벌대로 2435 두산위브 상가 3층",
        "addressLocality": "수성구",
        "addressRegion": "대구광역시",
        "postalCode": "42095",
        "addressCountry": "KR"
      },
      "hasMap": "https://naver.me/FDQX9ZIr",
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Friday"],
          "opens": "12:00",
          "closes": "20:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Saturday",
          "opens": "11:00",
          "closes": "16:00"
        }
      ],
      "areaServed": [
        {"@type": "AdministrativeArea", "name": "대구광역시"},
        {"@type": "AdministrativeArea", "name": "수성구"},
        {"@type": "AdministrativeArea", "name": "달서구"},
        {"@type": "AdministrativeArea", "name": "경산시"},
        {"@type": "AdministrativeArea", "name": "구미시"},
        {"@type": "AdministrativeArea", "name": "포항시"},
        {"@type": "AdministrativeArea", "name": "경주시"},
        {"@type": "AdministrativeArea", "name": "안동시"}
      ]
    },
    {
      "@type": "Person",
      "@id": "{{ .Site.BaseURL }}#physician",
      "name": "김대억",
      "jobTitle": ["대표원장", "한방신경정신과 박사"],
      "worksFor": {"@id": "{{ .Site.BaseURL }}#clinic"},
      "description": "해아림한의원 대구본점 대표원장, 『토닥토닥 틱장애』, 『걱정마 공황장애』 저자",
      "knowsAbout": ["틱장애", "ADHD", "공황장애", "불안장애", "자율신경실조증", "불면증", "강박증", "다한증", "사회공포증", "어지럼증"]
    }
    {{- if .IsHome }}
    ,
    {
      "@type": "WebSite",
      "@id": "{{ .Site.BaseURL }}#website",
      "url": "{{ .Site.BaseURL }}",
      "name": "해아림한의원 대구본점",
      "description": "{{ .Site.Params.description }}",
      "publisher": {"@id": "{{ .Site.BaseURL }}#clinic"}
    }
    {{- end }}
    {{- if or (eq .Type "community") (eq .Layout "community") (in .RelPermalink "community") }}
    ,
    {
      "@type": "MedicalWebPage",
      "@id": "{{ .Permalink }}#community",
      "url": "{{ .Permalink }}",
      "name": "{{ .Title }}",
      "description": "{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}",
      "author": {"@id": "{{ .Site.BaseURL }}#physician"},
      "publisher": {"@id": "{{ .Site.BaseURL }}#clinic"},
      "specialty": "Psychiatric",
      "about": [
        {"@type": "MedicalCondition", "name": "두뇌·신경계 치료사례"},
        {"@type": "MedicalCondition", "name": "틱장애 치료사례"},
        {"@type": "MedicalCondition", "name": "공황장애 치료사례"},
        {"@type": "MedicalCondition", "name": "자율신경실조증 치료사례"},
        {"@type": "MedicalCondition", "name": "불면증 치료사례"},
        {"@type": "MedicalCondition", "name": "어지럼증 치료사례"},
        {"@type": "MedicalCondition", "name": "ADHD 치료사례"}
      ]
    }
    {{- end }}
    {{- $slug := strings.Trim .RelPermalink "/" }}
    {{- $isDisease := or (eq .Type "disease") (eq .Layout "disease") (in (slice "tic-disorder" "panic-disorder" "dysautonomia" "insomnia" "dizziness" "adhd" "ocd" "anxiety-disorder" "hyperhidrosis" "social-phobia") (path.Base .RelPermalink)) }}
    {{- if $isDisease }}
    ,
    {
      "@type": "MedicalWebPage",
      "@id": "{{ .Permalink }}#webpage",
      "url": "{{ .Permalink }}",
      "name": "{{ .Title }}",
      "description": "{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}",
      "author": {"@id": "{{ .Site.BaseURL }}#physician"},
      "publisher": {"@id": "{{ .Site.BaseURL }}#clinic"},
      "about": {
        "@type": "MedicalCondition",
        "name": "{{ .Title }}"
      }
    }
    {{- $faqs := index site.Data.disease_faqs $slug }}
    {{- if not $faqs }}
      {{- $faqs = index site.Data.disease_faqs (path.Base .RelPermalink) }}
    {{- end }}
    {{- if $faqs }}
    ,
    {
      "@type": "FAQPage",
      "@id": "{{ .Permalink }}#faq",
      "mainEntity": [
        {{- range $idx, $faq := $faqs }}
        {{- if gt $idx 0 }},{{- end }}
        {
          "@type": "Question",
          "name": {{ $faq.q | jsonify }},
          "acceptedAnswer": {
            "@type": "Answer",
            "text": {{ $faq.a | jsonify }}
          }
        }
        {{- end }}
      ]
    }
    {{- end }}
    {{- end }}
    {{- if and (eq .Section "columns") .IsPage }}
    ,
    {
      "@type": "Article",
      "@id": "{{ .Permalink }}#article",
      "headline": "{{ .Title }}",
      "description": "{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}",
      "url": "{{ .Permalink }}",
      "author": {"@id": "{{ .Site.BaseURL }}#physician"},
      "publisher": {"@id": "{{ .Site.BaseURL }}#clinic"},
      "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
      "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
      "mainEntityOfPage": "{{ .Permalink }}"
    }
    {{- end }}
    {{- if not .IsHome }}
    ,
    {
      "@type": "BreadcrumbList",
      "@id": "{{ .Permalink }}#breadcrumb",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "홈",
          "item": "{{ .Site.BaseURL }}"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "{{ .Title }}",
          "item": "{{ .Permalink }}"
        }
      ]
    }
    {{- end }}
  ]
}
</script>
